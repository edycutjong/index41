[profile.default]
src = "contracts/src"
out = "out"
libs = ["lib", "node_modules"]
test = "contracts/test"
solc = "0.8.23"
optimizer = true
optimizer_runs = 200
evm_version = "shanghai"
remappings = [
    "forge-std/=lib/forge-std/src/",
    "@gluwa/usc-contracts/=node_modules/@gluwa/usc-contracts/",
]

# Deployment profile for CC3 testnet.
#
# EvmV1Decoder exposes `public` library functions, so it is an EXTERNAL library: a consumer must
# link against a deployed copy. Creditcoin already deployed one at the address below, and it is
# the same library — all nine public selectors were checked against `eth_getCode` on
# rpc.cc3-testnet.creditcoin.network (cf0d21c9 getTransactionType, 78190020 isValidTransactionType,
# 9d79c437 decodeCommonTxFields, 0dd5c77e decodeReceiptFields, d42370a7 / a386042c / 7aecc645 /
# c6114836 / 356954e8 decodeTypeSpecificFieldsType0-4, all present).
#
# Not applied to the default profile on purpose: unit tests run on a bare EVM where that address
# holds no code, so forge must deploy the library itself there.
[profile.cc3]
src = "contracts/src"
out = "out"
libs = ["lib", "node_modules"]
test = "contracts/test"
solc = "0.8.23"
optimizer = true
optimizer_runs = 200
evm_version = "shanghai"
remappings = [
    "forge-std/=lib/forge-std/src/",
    "@gluwa/usc-contracts/=node_modules/@gluwa/usc-contracts/",
]
libraries = [
    "node_modules/@gluwa/usc-contracts/contracts/decoding/EvmV1Decoder.sol:EvmV1Decoder:0x731c345d79Fb8BbDC541f9DF3b6317585F849F9f",
]

[rpc_endpoints]
cc3_testnet = "https://rpc.cc3-testnet.creditcoin.network"
