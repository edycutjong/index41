name: gitleaks

# GitHub's own secret scanning only matches KNOWN provider patterns on pushed commits. gitleaks
# catches project-shaped secrets and, with fetch-depth 0, scans the whole history — which is what
# matters at the private→public flip this repository goes through at submission.
#
# Configuration lives in .gitleaks.toml (audited allowlist of public keccak event-topic
# constants) plus .gitleaksignore (two 8.24.x-only false-positive fingerprints from the
# pre-rename eth.ts). Verified locally against both gitleaks 8.24.3 and 8.30.1: no leaks.

on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    - cron: "13 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Scan full history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Pinned to the SHA verified in run 31999208174 (installs gitleaks 8.24.3). The floating
      # @v3 tag drifted its bundled gitleaks between two runs on the same commit, which changed
      # the generic-api-key extraction and turned a clean scan red. .gitleaks.toml is written to
      # be correct under both the 8.24.x and 8.30.x extraction behaviours; the pin keeps it from
      # drifting a third way.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
