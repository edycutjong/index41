name: release

# Automatic semantic versioning from the commit log.
#
# The version is DERIVED, never hand-typed: scripts/next-version.mjs reads the
# commits since the last v*.*.* tag, maps them through this repository's own
# commit types (a stock Conventional Commits config would be wrong here — the log
# is mostly `docs:`, `prove:`, `bench:`, `meta:` and `deploy:`, which stock rules
# do not know), and prints the next version plus grouped release notes.
#
# Deliberately no third-party actions. This is the only workflow holding
# `contents: write`, and a marketplace action added here would inherit that token
# unpinned — in a repository that already runs CodeQL and gitleaks over its own
# source. Everything below is `actions/checkout`, node, and `gh`, which is
# preinstalled on the runner.

# Gated on CI, not on the push. Triggering on `push` would run this in parallel
# with the test suite and could tag a release from a commit whose contracts,
# typecheck or E2E had just failed. The chain is:
#
#   push → CI/CD Pipeline → (success) → release (tag + GitHub release) → deploy
#
# Loop safety: the version-bump commit this workflow pushes carries `[skip ci]`,
# so CI does not run for it, so no `workflow_run` fires and nothing re-releases.
# The head-commit guard below is the belt to that braces.
on:
  workflow_run:
    workflows: ["CI/CD Pipeline"]
    types: [completed]
    branches: ["main"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Compute the next version and print it, but do not tag or release"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  # never let two releases race for the same tag
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # Release only a green CI run, and never the commit this workflow itself
    # pushed. On a workflow_run event the payload is under `workflow_run` —
    # `github.event.head_commit` does not exist there and would read as empty.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       !startsWith(github.event.workflow_run.head_commit.message, 'chore(release):'))
    permissions:
      contents: write # create the tag, push the version bump, cut the release
    steps:
      - uses: actions/checkout@v4
        with:
          # The bump commit lands on main, so check out the branch rather than
          # the validated SHA — pushing from a detached commit that main has
          # moved past would be rejected anyway.
          ref: main
          fetch-depth: 0 # the whole log — the bump is derived from it
          # persist-credentials is needed to push the version-bump commit back
          persist-credentials: true

      - name: Guard — main must still be the commit CI validated
        id: guard
        if: github.event_name == 'workflow_run'
        run: |
          head="$(git rev-parse HEAD)"
          validated="${{ github.event.workflow_run.head_sha }}"
          if [ "$head" != "$validated" ]; then
            echo "::notice::main has moved past the commit CI validated ($validated -> $head); that newer commit has its own CI run, so this one stands down."
            echo "stale=true" >> "$GITHUB_OUTPUT"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Derive the next version
        id: v
        run: node scripts/next-version.mjs --github

      - name: Report
        run: |
          echo "### Release" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- bump: \`${{ steps.v.outputs.bump }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- next: \`${{ steps.v.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- releasing: \`${{ steps.v.outputs.should_release }}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Nothing to release
        if: steps.v.outputs.should_release != 'true'
        run: echo "No releasable commits since the last tag — stopping here."

      - name: Dry run
        if: >-
          steps.v.outputs.should_release == 'true' &&
          github.event_name == 'workflow_dispatch' &&
          inputs.dry_run
        run: |
          echo "DRY RUN — would tag ${{ steps.v.outputs.tag }}"
          echo "${{ steps.v.outputs.notes }}"

      - name: Tag, bump and release
        if: >-
          steps.v.outputs.should_release == 'true' &&
          steps.guard.outputs.stale != 'true' &&
          !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
          TAG: ${{ steps.v.outputs.tag }}
          NOTES: ${{ steps.v.outputs.notes }}
        run: |
          set -euo pipefail

          # Refuse to move an existing tag — releases are append-only.
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::$TAG already exists; refusing to overwrite a published release."
            exit 1
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Keep package.json in step with the tag. `npm version` would also tag,
          # so the write is done directly and committed here.
          node -e '
            const fs = require("fs");
            const p = JSON.parse(fs.readFileSync("package.json", "utf8"));
            p.version = process.env.VERSION;
            fs.writeFileSync("package.json", JSON.stringify(p, null, 2) + "\n");
          '

          printf '%s\n' "$NOTES" > /tmp/notes.md

          if ! git diff --quiet package.json; then
            git add package.json
            git commit -m "chore(release): $TAG [skip ci]"
            git push origin HEAD:main
          fi

          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"

          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file /tmp/notes.md \
            --verify-tag
